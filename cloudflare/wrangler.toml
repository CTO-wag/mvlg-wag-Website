# Einstellungen fuer das Auffangnetz (cloudflare/worker.js).
#
# Diese Datei beschreibt, WO der Worker laeuft. Was er tut, steht in worker.js.
# Geheimnisse stehen absichtlich NICHT hier - sie kaemen sonst mit ins
# Repository. Sie werden einzeln gesetzt, siehe ANLEITUNG.md.

name = "wag-auffangnetz"
main = "worker.js"

# Datum der Worker-Laufzeit. Nicht ohne Grund aendern: Ein neueres Datum kann
# das Verhalten aendern, und ein Auffangnetz soll sich genau dann nicht anders
# verhalten, wenn man es braucht.
compatibility_date = "2026-08-18"

# ---------------------------------------------------------------------------
#  Wo der Worker in den Weg gehen soll
# ---------------------------------------------------------------------------
#  Beide Adressen, weil der Ausfall beide trifft. Das Sternchen bedeutet
#  "jeder Weg" - der Worker muss vor ALLEM stehen, nicht nur vor der
#  Startseite: Wer mitten in der Arbeit ist, faellt auf einer Unterseite
#  hinein, nicht auf "/".
#
#  ACHTUNG: "zone_name" muss die Domain sein, wie sie in deinem Cloudflare-
#  Konto steht (ohne "www", ohne "https://").
routes = [
  { pattern = "mvlg-wag.de/*", zone_name = "mvlg-wag.de" },
  { pattern = "app.mvlg-wag.de/*", zone_name = "mvlg-wag.de" },
]

# ---------------------------------------------------------------------------
#  Der Zwischenspeicher fuer Meldungen
# ---------------------------------------------------------------------------
#  Ohne ihn laeuft alles andere weiter - dann zeigt die Fehlerseite nur keinen
#  Meldeknopf mehr, statt einen anzubieten, der nichts tut.
#  Die "id" bekommst du beim Anlegen (siehe ANLEITUNG.md, Schritt 3) und musst
#  sie hier eintragen.
[[kv_namespaces]]
binding = "LAGER"
id = "6507974c41344a2c94e117d19e49b66f"

# ---------------------------------------------------------------------------
#  Offene Werte (keine Geheimnisse)
# ---------------------------------------------------------------------------
[vars]
# Welche Adresse die Uhr unten abfragt. Nur noetig, wenn du den Zeitplan
# einschaltest.
PRUEF_ADRESSE = "https://mvlg-wag.de/"
# Ein eigener ntfy-Server, falls ihr je einen aufsetzt. Leer lassen = ntfy.sh.
NTFY_BASIS = "https://ntfy.sh"
# Bewerbungshinweise gehen unabhaengig vom Backend an den Vorstand.
BEWERBUNG_EMAILS = "ceo@exekutive.mvlg-wag.de,coo@exekutive.mvlg-wag.de,cro@recruitment.mvlg-wag.de,cto@tech.mvlg-wag.de"
MAIL_ABSENDER = "mail@mvlg-wag.de"
MAIL_ABSENDER_NAME = "Wirtschafts- & Investment-AG"
# Die Backend-Pruefung bleibt aus; der Zeitplan dient den E-Mail-Wiederholungen.
PRUEFUNG_AKTIV = "0"

# ---------------------------------------------------------------------------
#  Regelmaessig nachsehen, auch wenn niemand die Seite oeffnet
# ---------------------------------------------------------------------------
#  Alle fuenf Minuten werden unzustellbare Bewerbungs-E-Mails erneut versucht.
#  Backend-Ausfallalarme werden nur bei PRUEFUNG_AKTIV = "1" regelmaessig
#  geprueft und gemeldet.
[triggers]
crons = ["*/5 * * * *"]
