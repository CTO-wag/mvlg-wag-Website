{#
  Grundgeruest jeder Seite.

  Das Stylesheet liegt als eigene Datei und nicht mehr als <style>-Block:
  In V1 waren 73 von 78 KB einer Anmeldeseite immer wieder derselbe CSS-Block,
  den kein Browser zwischenspeichern konnte. Jetzt wird er einmal geladen.

  Jedes <script> traegt nonce="{{ nonce }}". Ohne den Nonce laesst die
  Sicherheitsrichtlinie es nicht laufen - und eingeschleustes JavaScript hat
  ihn nie.
#}<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{# Zuerst das gespeicherte Farbschema setzen, noch bevor der Koerper gezeichnet
   wird - sonst blitzt beim Laden kurz die falsche Fassung auf.

   Ohne gespeicherte Wahl gilt HELL, nicht die Einstellung des Geraets. Vorher
   entschied prefers-color-scheme: Wer sein Handy nachts auf dunkel stellt,
   bekam die Plattform dunkel, ohne das je gewollt zu haben - und hielt es fuer
   einen Anzeigefehler. Der Schalter oben rechts bleibt; wer dunkel will,
   waehlt es einmal und behaelt es.

   Im selben Zug wird vermerkt, ob die Seite als App laeuft. Das muss HIER
   stehen und nicht in basis.js: Die Kopfleiste braucht dann oben mehr Platz,
   und ein Abstand, der erst nach dem ersten Zeichnen dazukommt, ist ein
   sichtbarer Sprung. `display-mode` kennen neuere Fassungen, `standalone`
   die aelteren iPhones - beide gefragt, weil sonst genau die Geraete
   durchfallen, um die es geht. #}
<script nonce="{{ nonce }}">(function(){try{var t=localStorage.getItem('thema');if(t!=='dark'&&t!=='light'){t='light';}document.documentElement.setAttribute('data-theme',t);var a=false;try{a=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: minimal-ui)').matches;}catch(e){}if(a||navigator.standalone===true){document.documentElement.setAttribute('data-app','1');}}catch(e){}})();</script>
{# Titel und Beschreibung sind das, was in der Trefferliste steht.

   Aus der Search Console: 238 der 262 Einblendungen kommen von der Suche
   „mvlg", Platz 5,2 - aber nur vier Klicks. Wer „mvlg" tippt, sucht die
   Schule, nicht uns; diesen Platz gewinnen wir nicht und sollen ihn auch
   nicht gewinnen. Was sich aendern laesst, ist die Zeile daneben: Sie muss
   in drei Sekunden sagen, dass hier eine AG DIESER Schule steht, fuer wen
   sie ist und was man tun kann.

   Deshalb: „WAG" mit hinein (danach wurde gesucht), „MvLG" und „Koblenz"
   bleiben drin, und die Beschreibung nennt Zielgruppe, Inhalt und Takt statt
   sich selbst zu beschreiben. #}
<title>{% block titel %}{{ seitentitel or "Wirtschafts- & Investment-AG (WAG) am MvLG Koblenz" }}{% endblock %}</title>
{# Auf einer Seite mit Passwortfeld gar keine Beschreibung. Ein leerer
   String liefe sonst in den Vorgabetext - und der nennt die Schule, was
   genau das Signal ist, an dem sich Chrome gestossen hat. #}
{% if not anmeldeseite %}
<meta name="description" content="{{ seitenbeschreibung or 'Schüler-AG am Max-von-Laue-Gymnasium Koblenz: Börse, Finanzen und eigene Gründungsprojekte. Klasse 9 bis 13, ohne Vorwissen, alle zwei Wochen.' }}">
{% endif %}
<meta name="robots" content="{{ robots or 'index, follow' }}">
<link rel="canonical" href="{{ SITE_URL }}{{ pfad or '/' }}">
{% block kopf_extra %}{% endblock %}
{# Ein fester Wert, kein prefers-color-scheme: Die Seite richtet sich nicht
   mehr nach der Geraeteeinstellung, also darf die Leiste des Browsers es auch
   nicht - sonst steht eine dunkle Leiste ueber einer hellen Seite. #}
<meta name="theme-color" content="#0E2647">
<link rel="icon" type="image/png" href="{{ statisch('bilder/favicon.png') }}">
<link rel="apple-touch-icon" href="{{ statisch('bilder/apple-touch-icon.png') }}">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WAG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
{# Die Schriften liegen im eigenen Ordner statt bei Google - siehe
   statisch/stil/schriften.css. Das spart vor dem ersten Buchstaben eine
   fremde DNS-Auflösung samt TLS-Aufbau und schickt nebenbei nicht mehr die
   IP-Adresse jedes Mitglieds nach Kalifornien. #}
{# Ohne Fassungsnummer - und das ist wichtig: schriften.css laedt die Datei
   unter dem blossen Pfad. Mit "?v=..." waeren es zwei verschiedene Adressen,
   der Vorabruf liefe ins Leere und der Browser holte dieselben 45 KB ein
   zweites Mal. Genau das stand als Warnung in der Konsole. Schriftdateien
   brauchen die Nummer auch nicht: ihr Name enthaelt Familie und Schnitt und
   aendert sich nie. #}
<link rel="preload" href="/statisch/schrift/ibm-plex-sans-400-latin.woff2"
      as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ statisch('stil/schriften.css') }}">
<link rel="stylesheet" href="{{ statisch('stil/basis.css') }}">
{% block stil %}{% endblock %}
</head>
<body{% block koerper_attr %}{% endblock %}>
<a class="sprung" href="#inhalt">Zum Inhalt springen</a>

{% block kopfzeile %}
<header class="seite" id="kopfzeile">
  <a href="{{ WEBSITE_URL }}/" class="marke-logo">
    <img class="wappen" src="{{ statisch('bilder/logo-klein.webp') }}" width="226" height="180" alt="Logo der Wirtschafts- und Investment-AG">
    <span class="marke-text">Wirtschafts- &amp; Investment-AG<span class="marke-motto">An alle, die größer denken.</span></span>
  </a>
  <button class="burger" type="button" aria-label="Menü öffnen" aria-expanded="false" data-burger><span class="burger-striche" aria-hidden="true"><span></span><span></span><span></span></span></button>
  <nav aria-label="Hauptmenü">
    {% block navigation %}
    <a href="{{ WEBSITE_URL }}/#start">Start</a>
    <a href="{{ WEBSITE_URL }}/#ueber-uns">Über uns</a>
    <a href="{{ WEBSITE_URL }}/#arbeit">Aktivitäten</a>
    <a href="{{ WEBSITE_URL }}/#kontakt">Kontakt</a>
    <a href="{{ WEBSITE_URL }}/bewerbung">Bewerbung</a>
    {% if user %}
    <a href="{{ DASHBOARD_URL }}/" class="betont">Dashboard</a>
    <a href="{{ WEBSITE_URL }}/logout">Abmelden</a>
    {% else %}
    <a href="{{ WEBSITE_URL }}/login" class="betont">Login</a>
    {% endif %}
    {% endblock %}
    <button class="thema-schalter" type="button" data-thema
            aria-label="Zwischen hellem und dunklem Erscheinungsbild wechseln"
            title="Dunkelmodus umschalten">
      <span class="knopf">
        <svg class="sonne" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="mond" viewBox="0 0 24 24" fill="currentColor"><path d="M20.9 14.6c-3.9 1.4-8.4-1-9.8-4.9-1-2.7-.4-5.6 1.4-7.7-4.4.6-7.9 4.3-7.9 8.9 0 5 4 9 9 9 4 0 7.4-2.6 8.6-6.2-.4.1-.9.2-1.3.3z"/></svg>
      </span>
    </button>
  </nav>
</header>
{% endblock %}

{% block ticker %}
<div class="ticker" aria-hidden="true">
  <span>Wirtschafts- &amp; Investment-AG</span><span>Bewerbungen offen</span><span>Investments</span><span>Wettbewerbe</span><span>Planspiele</span>
</div>
{% endblock %}

<main id="inhalt" class="{% block hauptklasse %}{% endblock %}">{% block inhalt %}{% endblock %}</main>

{% block fusszeile %}
<footer class="seite">
  <div class="fuss-links">
    <a href="{{ WEBSITE_URL }}/">Startseite</a>
    <a href="{{ WEBSITE_URL }}/#ueber-uns">Über uns</a>
    <a href="{{ WEBSITE_URL }}/#arbeit">Aktivitäten</a>
    <a href="{{ WEBSITE_URL }}/#kontakt">Kontakt</a>
    <a href="{{ WEBSITE_URL }}/bewerbung">Bewerbung</a>
    <a href="{{ WEBSITE_URL }}/impressum">Impressum</a>
    <a href="{{ WEBSITE_URL }}/datenschutz">Datenschutz</a>
  </div>
  <p class="fuss-zeile">Wirtschafts- &amp; Investment-AG · Offizielle Schüler-AG des
    <a href="https://www.mvlg.de" rel="noopener">Max-von-Laue-Gymnasiums Koblenz (MvLG)</a></p>
  <p class="fuss-urheber">
    © 2026 <strong>Wirtschafts- &amp; Investment-AG</strong> am
    Max-von-Laue-Gymnasium Koblenz. Alle Rechte vorbehalten.
  </p>
</footer>
{% endblock %}

<script nonce="{{ nonce }}" src="{{ statisch('js/basis.js') }}"></script>
{# Geraetediagnose fuer den Support (kern/diagnose.py). Nur fuer Angemeldete:
   Bei allen anderen gaebe es niemanden, dem die Angaben zuzuordnen waeren -
   und Daten ohne Zweck werden hier nicht erhoben. Steht in der gemeinsamen
   Basis und nicht nur im Dashboard, weil ein Fehler auf der oeffentlichen
   Seite genauso eine Supportfrage ist. #}
{% if user %}
<script nonce="{{ nonce }}" src="{{ statisch('js/diagnose.js') }}" defer></script>
{% endif %}
{% block skripte %}{% endblock %}
</body>
</html>
